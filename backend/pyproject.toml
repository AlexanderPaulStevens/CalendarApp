[project]
name = "calendar-planner"
version = "0.1.0"
description = "Rule-driven planning calendar API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.0.0",
    "tzdata>=2026.4",
    "openai>=3.22.1",
]

[dependency-groups]
dev = [
    "httpx>=0.26.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
